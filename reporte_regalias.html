<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte de Regalías por Ruta — Ribereña</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --azul:      #0A2342;
    --azul-med:  #164474;
    --azul-claro:#1A6BAF;
    --acento:    #00B4D8;
    --blanco:    #FFFFFF;
    --gris-bg:   #F4F6FA;
    --gris-borde:#CBD5E1;
    --gris-texto:#64748B;
    --verde:     #059669;
    --rojo:      #DC2626;
    --amber:     #D97706;
    --amber-bg:  #FEF3C7;
    --amber-text:#92400E;
    --radio:     6px;
    --sel-bg:    #EFF8FF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--gris-bg); color: var(--azul); font-size: 13px; line-height: 1.5; min-height: 100vh; }

  /* HEADER */
  .top-header { background: var(--azul); color: var(--blanco); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; position: sticky; top: 0; z-index: 100; }
  .top-header-left { display: flex; align-items: center; gap: 14px; }
  .logo-wrap { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.10); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .logo-wrap img { width: 28px; height: 28px; object-fit: contain; filter: brightness(0) invert(1); }
  .top-header-titles .sup { font-size: 9px; color: var(--acento); letter-spacing: 1.5px; text-transform: uppercase; }
  .top-header-titles h1 { font-family: 'DM Serif Display', serif; font-size: 17px; font-weight: 400; line-height: 1.2; }
  .top-header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .nav-pill { font-size: 11px; font-weight: 600; color: var(--acento); text-decoration: none; border: 1px solid rgba(0,180,216,.3); background: rgba(0,180,216,.08); padding: 5px 12px; border-radius: 20px; white-space: nowrap; transition: background .15s; }
  .nav-pill:hover { background: rgba(0,180,216,.18); }
  .updated-tag { font-size: 10px; color: rgba(255,255,255,.45); }

  /* FILTROS */
  .filtros-bar { background: var(--blanco); border-bottom: 1px solid var(--gris-borde); padding: 10px 28px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .filtros-bar label { font-size: 11px; font-weight: 600; color: var(--gris-texto); text-transform: uppercase; letter-spacing: .5px; }
  .filtros-bar input[type="date"] { border: 1px solid var(--gris-borde); border-radius: var(--radio); padding: 6px 10px; font-size: 12px; font-family: 'DM Sans', sans-serif; color: var(--azul); background: var(--blanco); outline: none; }
  .filtros-bar input[type="date"]:focus { border-color: var(--acento); }
  .btn-cargar { background: var(--azul); color: var(--blanco); border: none; border-radius: var(--radio); padding: 7px 16px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: opacity .15s; }
  .btn-cargar:hover { opacity: .85; }
  .btn-cargar:disabled { opacity: .5; cursor: not-allowed; }
  .spinner { width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* RESUMEN */
  .resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; padding: 20px 28px 0; }
  .card-stat { background: var(--blanco); border: 1px solid var(--gris-borde); border-radius: var(--radio); padding: 13px 14px; text-align: center; }
  .card-stat .num { font-family: 'DM Mono', monospace; font-size: 24px; font-weight: 500; margin-bottom: 4px; color: var(--azul); }
  .card-stat .lbl { font-size: 10px; color: var(--gris-texto); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
  .card-stat.amber .num { color: var(--amber); }

  /* GRÁFICO BARRAS VERTICALES */
  .grafico-wrap { margin: 16px 28px 0; background: var(--blanco); border: 1px solid var(--gris-borde); border-radius: var(--radio); padding: 16px 20px; }
  .grafico-titulo { font-size: 10px; font-weight: 600; color: var(--gris-texto); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
  .grafico-titulo::before { content:''; display:block; width:3px; height:12px; background:var(--acento); border-radius:2px; }
  .chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-bottom: 24px; position: relative; }
  .chart-bar-wrap { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 0; height: 100%; justify-content: flex-end; position: relative; }
  .chart-bar { width: 100%; background: var(--azul-claro); border-radius: 3px 3px 0 0; transition: height .4s ease; min-height: 2px; cursor: pointer; }
  .chart-bar:hover { background: var(--azul); }
  .chart-bar-val { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; color: var(--azul); text-align: center; margin-bottom: 3px; }
  .chart-bar-lbl { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-size: 9px; color: var(--gris-texto); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60px; text-align: center; }
  .chart-baseline { position: absolute; bottom: 24px; left: 0; right: 0; height: 1px; background: var(--gris-borde); }

  /* LAYOUT DOS COLUMNAS */
  .layout { display: grid; grid-template-columns: 280px 1fr; gap: 0; margin: 16px 28px; background: var(--blanco); border: 1px solid var(--gris-borde); border-radius: var(--radio); overflow: hidden; min-height: 400px; }

  /* COL IZQUIERDA */
  .col-izq { border-right: 1px solid var(--gris-borde); overflow-y: auto; max-height: 600px; }
  .col-izq-header { padding: 10px 14px; font-size: 10px; font-weight: 600; color: var(--gris-texto); text-transform: uppercase; letter-spacing: .5px; background: var(--azul); color: rgba(255,255,255,.7); border-bottom: 1px solid var(--azul-med); position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; }
  .btn-clear { font-size: 10px; background: rgba(255,255,255,.1); border: none; color: var(--acento); cursor: pointer; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
  .btn-clear:hover { background: rgba(255,255,255,.2); }
  .ruta-node { border-bottom: 1px solid var(--gris-borde); }
  .ruta-node-header { padding: 9px 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .ruta-node-header:hover { background: var(--gris-bg); }
  .ruta-node-header.selected { background: var(--sel-bg); border-left: 3px solid var(--acento); }
  .ruta-chevron { font-size: 9px; color: var(--gris-texto); transition: transform .15s; flex-shrink: 0; }
  .ruta-node.open .ruta-chevron { transform: rotate(90deg); }
  .ruta-node-name { font-size: 12px; font-weight: 600; color: var(--azul); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ruta-node-fecha { font-size: 10px; color: var(--gris-texto); white-space: nowrap; font-family: 'DM Mono', monospace; }
  .ruta-badge { font-size: 10px; font-weight: 700; background: var(--amber-bg); color: var(--amber-text); padding: 1px 7px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
  .clientes-list { display: none; }
  .ruta-node.open .clientes-list { display: block; }
  .cliente-node { padding: 7px 14px 7px 32px; display: flex; align-items: center; justify-content: space-between; gap: 6px; cursor: pointer; border-top: 1px solid var(--gris-borde); }
  .cliente-node:hover { background: var(--gris-bg); }
  .cliente-node.selected { background: var(--sel-bg); border-left: 3px solid var(--acento); }
  .cliente-node-name { font-size: 12px; color: var(--azul); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cliente-badge { font-size: 10px; font-weight: 700; background: var(--amber-bg); color: var(--amber-text); padding: 1px 7px; border-radius: 10px; flex-shrink: 0; }

  /* COL DERECHA */
  .col-der { display: flex; flex-direction: column; }
  .col-der-header { padding: 10px 16px; background: var(--azul); border-bottom: 1px solid var(--azul-med); }
  .col-der-header-label { font-size: 10px; font-weight: 600; color: rgba(255,255,255,.5); text-transform: uppercase; letter-spacing: .5px; }
  .col-der-titulo { font-family: 'DM Serif Display', serif; font-size: 15px; color: var(--blanco); font-weight: 400; margin-top: 1px; }
  .col-der-sub { font-size: 10px; color: var(--acento); margin-top: 1px; }
  .col-der-scroll { overflow-y: auto; max-height: 552px; flex: 1; }
  .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 40px; text-align: center; color: var(--gris-texto); min-height: 300px; }
  .placeholder .ico { font-size: 30px; margin-bottom: 10px; }
  .placeholder p { font-size: 12px; line-height: 1.5; max-width: 200px; }

  /* BREADCRUMB */
  .breadcrumb { padding: 8px 16px; font-size: 11px; color: var(--gris-texto); border-bottom: 1px solid var(--gris-borde); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; background: var(--gris-bg); }
  .breadcrumb span { color: var(--azul-claro); font-weight: 600; }

  /* TABLA PRODUCTOS */
  .prod-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .prod-table thead tr { background: var(--azul-med); }
  .prod-table th { padding: 8px 16px; text-align: left; font-size: 10px; font-weight: 600; color: var(--blanco); text-transform: uppercase; letter-spacing: .4px; position: sticky; top: 0; }
  .prod-table th.r, .prod-table td.r { text-align: right; }
  .prod-table td { padding: 9px 16px; border-top: 1px solid var(--gris-borde); color: var(--azul); }
  .prod-table td.r { font-family: 'DM Mono', monospace; font-size: 11.5px; }
  .prod-table tr:nth-child(even) td { background: var(--gris-bg); }
  .prod-table tr:hover td { background: #EFF8FF !important; }
  .tag-reg { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 10px; background: var(--amber-bg); color: var(--amber-text); margin-left: 6px; letter-spacing: .3px; text-transform: uppercase; }
  .prod-cant { font-family: 'DM Mono', monospace; font-weight: 500; color: var(--amber); }
  .total-row td { border-top: 2px solid var(--gris-borde) !important; font-weight: 600; background: var(--azul) !important; color: var(--blanco) !important; }
  .total-row td.r { color: var(--acento) !important; }

  /* BTN APPSHEET */
  .btn-appsheet { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:600; padding:3px 10px; border-radius:20px; border:1px solid rgba(0,180,216,.3); background:rgba(0,180,216,.08); color:var(--acento); text-decoration:none; white-space:nowrap; transition:background .15s; }
  .btn-appsheet:hover { background:rgba(0,180,216,.18); }

  .estado { text-align: center; padding: 60px 24px; color: var(--gris-texto); }
  .estado .ico { font-size: 38px; margin-bottom: 12px; }
  .estado h3 { font-family: 'DM Serif Display', serif; font-size: 18px; font-weight: 400; color: var(--azul); margin-bottom: 6px; }
  .estado p { font-size: 12px; line-height: 1.6; max-width: 340px; margin: 0 auto; }
  .error-box { background: #FEE2E2; border: 1px solid #FECACA; border-radius: var(--radio); padding: 10px 16px; color: #991B1B; font-size: 12px; margin: 14px 28px; }

  .page-footer { background: var(--azul); color: rgba(255,255,255,.4); padding: 12px 28px; display: flex; justify-content: space-between; align-items: center; font-size: 10px; letter-spacing: .6px; margin-top: 32px; }
  .page-footer strong { color: var(--acento); }

  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; margin: 12px 14px; }
    .col-izq { border-right: none; border-bottom: 1px solid var(--gris-borde); max-height: 260px; }
    .top-header, .filtros-bar, .resumen { padding-left: 14px; padding-right: 14px; }
    .grafico-wrap { margin-left: 14px; margin-right: 14px; }
    .resumen { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="top-header">
  <div class="top-header-left">
    <div class="logo-wrap">
      <img src="https://drive.google.com/thumbnail?id=1-AjJ5DUWQtqArYaK9aQOxixJwG32frEG&sz=w128" alt="Ribereña" onerror="this.parentElement.innerHTML='<span style=\'font-family:DM Serif Display,serif;font-size:16px;color:#00B4D8\'>R</span>'">
    </div>
    <div class="top-header-titles">
      <div class="sup">Distribución</div>
      <h1>Regalías por Ruta</h1>
    </div>
  </div>
  <div class="top-header-right">
    <a href="reporte_inventario_rutas.html" class="nav-pill">📦 Inventario</a>
    <a href="reporte_cierre_ventas_gsheets.html" class="nav-pill">📋 Cierre</a>
    <span class="updated-tag" id="ultima-act"></span>
  </div>
</div>

<div class="filtros-bar">
  <label>Desde</label>
  <input type="date" id="fecha-inicio">
  <span style="color:var(--gris-borde);">—</span>
  <label>Hasta</label>
  <input type="date" id="fecha-fin">
  <button class="btn-cargar" id="btn-cargar" onclick="cargarDatos()">
    <div class="spinner" id="spinner"></div>
    <span id="btn-texto">Cargar datos</span>
  </button>
</div>

<div id="error-container"></div>

<div class="resumen" id="resumen" style="display:none;">
  <div class="card-stat"><div class="num" id="s-rutas">—</div><div class="lbl">Rutas</div></div>
  <div class="card-stat"><div class="num" id="s-clientes">—</div><div class="lbl">Clientes</div></div>
  <div class="card-stat amber"><div class="num" id="s-total-reg">—</div><div class="lbl">Unidades</div></div>
  <div class="card-stat"><div class="num" id="s-productos">—</div><div class="lbl">Productos</div></div>
</div>

<div id="grafico-container" style="display:none;"></div>

<div id="main-content">
  <div class="estado">
    <div class="ico">🎁</div>
    <h3>Regalías por Ruta</h3>
    <p>Selecciona un rango de fechas y presiona <strong>Cargar datos</strong> para ver las regalías por ruta y cliente.</p>
  </div>
</div>

<div class="page-footer">
  <span>Ribereña Distribución · Sistema de Gestión de Rutas</span>
  <strong>Regalías por Ruta</strong>
  <span>v2.0</span>
</div>

<script>
const SHEET_OT='https://docs.google.com/spreadsheets/d/e/2PACX-1vRWQe1MHjBbSlsFf7UDg7eCmXV0Mq7dfYY1s_bJAqqAlLCh2LqTFVQZHfX_mYpbQ1084e-KnZJwlXuL/pub?gid=392195505&single=true&output=csv';
let _data={rutas:[],prodGlobal:{}};
let _sel={tipo:null,rutaId:null,clienteId:null};

function parseCSVLine(line){const r=[];let c='',inQ=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'&&!inQ){inQ=true;}else if(ch==='"'&&inQ){inQ=false;}else if(ch===','&&!inQ){r.push(c.trim());c='';}else{c+=ch;}}r.push(c.trim());return r;}
function parseCSV(text){const lines=text.trim().split('\n');if(lines.length<2)return[];const headers=parseCSVLine(lines[0]).map(h=>h.trim().replace(/^"|"$/g,''));return lines.slice(1).map(line=>{const vals=parseCSVLine(line);const obj={};headers.forEach((h,i)=>{obj[h]=(vals[i]||'').trim().replace(/^"|"$/g,'');});return obj;}).filter(r=>Object.values(r).some(v=>v!==''));}
function normFecha(f){if(!f)return'';f=f.trim();if(/^\d{4}-\d{2}-\d{2}/.test(f))return f.substring(0,10);const p=f.split(/[\/\-]/);if(p.length===3){if(p[0].length===4)return`${p[0]}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}`;return`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;}return f;}
function enRango(f,d,h){const n=normFecha(f);return n>=d&&n<=h;}
function hoy(){return new Date().toISOString().split('T')[0];}
function fmt(n){return Math.round(n).toLocaleString('es');}
function fmtF(f){if(!f)return'';const[y,m,d]=f.split('-');return`${d}/${m}/${y}`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function cargarDatos(){
  const desde=document.getElementById('fecha-inicio').value;
  const hasta=document.getElementById('fecha-fin').value;
  if(!desde||!hasta){mostrarError('Selecciona un rango de fechas.');return;}
  if(desde>hasta){mostrarError('La fecha inicio debe ser anterior a la fecha final.');return;}
  setLoading(true);limpiarError();_sel={tipo:null,rutaId:null,clienteId:null};
  try{
    const resp=await fetch(SHEET_OT);
    if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
    const rows=parseCSV(await resp.text());
    const regalia=rows.filter(r=>r['ELIMINADO']!=='Y'&&enRango(r['Fecha'],desde,hasta)&&(r['Regalia']||'').toString().trim().toUpperCase()==='SI');
    if(regalia.length===0){mostrarVacio('Sin regalías en el período','No se encontraron regalías entre las fechas seleccionadas.');document.getElementById('grafico-container').style.display='none';document.getElementById('resumen').style.display='none';setLoading(false);return;}
    const porRuta={};const prodGlobal={};
    regalia.forEach(r=>{
      const ruta=r['Ruta']||'Sin ruta';
      const clienteNombre=r['Des. Cliente']||r['Cliente']||'Sin cliente';
      const producto=r['Producto']||'Sin producto';
      const cant=parseFloat(r['Cantidad'])||0;
      const fecha=r['Fecha']||'';
      const fechaNorm=normFecha(fecha);
      if(!porRuta[ruta])porRuta[ruta]={id:ruta,ruta,clientes:{},totalReg:0,fecha,fechaNorm};
      if(fechaNorm>porRuta[ruta].fechaNorm){porRuta[ruta].fecha=fecha;porRuta[ruta].fechaNorm=fechaNorm;}
      const rutaObj=porRuta[ruta];
      if(!rutaObj.clientes[clienteNombre])rutaObj.clientes[clienteNombre]={id:clienteNombre,nombre:clienteNombre,productos:{},totalReg:0};
      const cl=rutaObj.clientes[clienteNombre];
      if(!cl.productos[producto])cl.productos[producto]={producto,cant:0};
      cl.productos[producto].cant+=cant;
      cl.totalReg+=cant;
      rutaObj.totalReg+=cant;
      prodGlobal[producto]=(prodGlobal[producto]||0)+cant;
    });
    const rutas=Object.values(porRuta).sort((a,b)=>{if(b.fechaNorm>a.fechaNorm)return 1;if(b.fechaNorm<a.fechaNorm)return-1;return b.totalReg-a.totalReg;});
    rutas.forEach(r=>{r.clientes=Object.values(r.clientes).sort((a,b)=>b.totalReg-a.totalReg);});
    _data={rutas,prodGlobal};
    const totalClientes=new Set(regalia.map(r=>r['Des. Cliente']||r['Cliente'])).size;
    const totalReg=rutas.reduce((s,r)=>s+r.totalReg,0);
    document.getElementById('s-rutas').textContent=rutas.length;
    document.getElementById('s-clientes').textContent=totalClientes;
    document.getElementById('s-total-reg').textContent=fmt(totalReg);
    document.getElementById('s-productos').textContent=Object.keys(prodGlobal).length;
    document.getElementById('resumen').style.display='';
    document.getElementById('ultima-act').textContent='Actualizado '+new Date().toLocaleTimeString('es');
    renderGrafico(prodGlobal);
    renderLayout(rutas);
  }catch(e){mostrarError('Error al cargar datos: '+e.message);}
  setLoading(false);
}

function renderGrafico(prodGlobal){
  const prods=Object.entries(prodGlobal).sort((a,b)=>b[1]-a[1]).slice(0,12);
  if(!prods.length){document.getElementById('grafico-container').style.display='none';return;}
  const maxVal=prods[0][1];
  let bars='';
  prods.forEach(([prod,cant])=>{const pct=Math.round((cant/maxVal)*96)+4;bars+=`<div class="chart-bar-wrap"><div class="chart-bar-val">${fmt(cant)}</div><div class="chart-bar" style="height:${pct}%" title="${esc(prod)}: ${fmt(cant)} unidades"></div><div class="chart-bar-lbl">${esc(prod)}</div></div>`;});
  document.getElementById('grafico-container').style.display='';
  document.getElementById('grafico-container').innerHTML=`<div class="grafico-wrap"><div class="grafico-titulo">Frecuencia de regalías por producto — período filtrado</div><div class="chart-bars"><div class="chart-baseline"></div>${bars}</div></div>`;
}

function renderLayout(rutas){
  let arbol='';
  rutas.forEach((r,ri)=>{
    const appsheetUrl=`https://www.appsheet.com/start/8a5fd5f4-b565-4aa9-913b-9b48bfa7b6dc?platform=desktop#appName=Ribere%C3%B1aApp-753059166&row=${encodeURIComponent(r.ruta)}&view=MER_RUTA_Detail`;
    let clisHtml='<div class="clientes-list">';
    r.clientes.forEach((cl,ci)=>{clisHtml+=`<div class="cliente-node" id="cn-${ri}-${ci}" onclick="selCliente(${ri},${ci})"><span class="cliente-node-name">${esc(cl.nombre)}</span><span class="cliente-badge">🎁 ${fmt(cl.totalReg)}</span></div>`;});
    clisHtml+='</div>';
    arbol+=`<div class="ruta-node" id="rn-${ri}">
      <div class="ruta-node-header" onclick="toggleRuta(${ri})">
        <span class="ruta-chevron">▶</span>
        <span class="ruta-node-name">Ruta ${esc(r.ruta)}</span>
        <span class="ruta-node-fecha">${esc(r.fecha)}</span>
        <span class="ruta-badge">${fmt(r.totalReg)}</span>
      </div>${clisHtml}</div>`;
  });
  document.getElementById('main-content').innerHTML=`
    <div class="layout">
      <div class="col-izq">
        <div class="col-izq-header">Rutas y clientes<button class="btn-clear" onclick="limpiarSel()">Ver todo</button></div>
        ${arbol}
      </div>
      <div class="col-der" id="col-der">
        <div class="col-der-header" id="col-der-header">
          <div class="col-der-header-label">Detalle de productos</div>
          <div class="col-der-titulo">Selecciona una ruta o cliente</div>
        </div>
        <div class="placeholder" id="der-placeholder"><div class="ico">👈</div><p>Selecciona una ruta o cliente para ver el detalle</p></div>
        <div class="col-der-scroll" id="der-tabla" style="display:none;"></div>
      </div>
    </div>`;
}

function toggleRuta(ri){const node=document.getElementById('rn-'+ri);const wasOpen=node.classList.contains('open');node.classList.toggle('open');if(!wasOpen)selRuta(ri);}
function selRuta(ri){
  document.querySelectorAll('.ruta-node-header').forEach(h=>h.classList.remove('selected'));
  document.querySelectorAll('.cliente-node').forEach(c=>c.classList.remove('selected'));
  document.getElementById('rn-'+ri).querySelector('.ruta-node-header').classList.add('selected');
  _sel={tipo:'ruta',rutaId:ri,clienteId:null};mostrarProductos();
}
function selCliente(ri,ci){
  document.querySelectorAll('.ruta-node-header').forEach(h=>h.classList.remove('selected'));
  document.querySelectorAll('.cliente-node').forEach(c=>c.classList.remove('selected'));
  document.getElementById('cn-'+ri+'-'+ci).classList.add('selected');
  _sel={tipo:'cliente',rutaId:ri,clienteId:ci};mostrarProductos();
}
function limpiarSel(){
  document.querySelectorAll('.ruta-node-header').forEach(h=>h.classList.remove('selected'));
  document.querySelectorAll('.cliente-node').forEach(c=>c.classList.remove('selected'));
  _sel={tipo:null,rutaId:null,clienteId:null};
  document.getElementById('der-placeholder').style.display='flex';
  document.getElementById('der-tabla').style.display='none';
  document.getElementById('col-der-header').innerHTML='<div class="col-der-header-label">Detalle de productos</div><div class="col-der-titulo">Selecciona una ruta o cliente</div>';
}
function mostrarProductos(){
  const{tipo,rutaId,clienteId}=_sel;
  const ruta=_data.rutas[rutaId];
  let prods={},titulo='',subtitulo='';
  if(tipo==='ruta'){
    titulo=`Ruta ${ruta.ruta}`;
    subtitulo=`${ruta.clientes.length} clientes · ${ruta.fecha} · ${fmt(ruta.totalReg)} unidades`;
    ruta.clientes.forEach(cl=>{Object.values(cl.productos).forEach(p=>{prods[p.producto]=(prods[p.producto]||0)+p.cant;});});
  }else{
    const cl=ruta.clientes[clienteId];
    titulo=cl.nombre;
    subtitulo=`Ruta ${ruta.ruta} · ${fmt(cl.totalReg)} unidades`;
    Object.values(cl.productos).forEach(p=>{prods[p.producto]=p.cant;});
  }
  const prodsArr=Object.entries(prods).sort((a,b)=>b[1]-a[1]);
  const total=prodsArr.reduce((s,[,c])=>s+c,0);
  const breadcrumb=tipo==='cliente'?`Ruta ${esc(ruta.ruta)} &rsaquo; <span>${esc(ruta.clientes[clienteId].nombre)}</span>`:`<span>Ruta ${esc(ruta.ruta)}</span> · todos los clientes`;
  const filas=prodsArr.map(([prod,cant])=>`<tr><td>${esc(prod)}<span class="tag-reg">Regalía</span></td><td class="r prod-cant">${fmt(cant)}</td><td class="r" style="color:var(--gris-texto)">${Math.round(cant/total*100)}%</td></tr>`).join('')
    +`<tr class="total-row"><td>Total</td><td class="r">${fmt(total)}</td><td class="r">100%</td></tr>`;
  document.getElementById('col-der-header').innerHTML=`<div class="col-der-header-label">Detalle de productos</div><div class="col-der-titulo">${esc(titulo)}</div><div class="col-der-sub">${subtitulo}</div>`;
  document.getElementById('der-placeholder').style.display='none';
  const derTabla=document.getElementById('der-tabla');
  derTabla.style.display='block';
  derTabla.innerHTML=`<div class="breadcrumb">${breadcrumb}</div><table class="prod-table"><thead><tr><th>Producto</th><th class="r">Cantidad</th><th class="r">%</th></tr></thead><tbody>${filas}</tbody></table>`;
}

function setLoading(v){document.getElementById('spinner').style.display=v?'block':'none';document.getElementById('btn-texto').textContent=v?'Cargando...':'Cargar datos';document.getElementById('btn-cargar').disabled=v;}
function mostrarError(msg){document.getElementById('error-container').innerHTML=`<div class="error-box">⚠ ${msg}</div>`;document.getElementById('main-content').innerHTML='';document.getElementById('resumen').style.display='none';}
function limpiarError(){document.getElementById('error-container').innerHTML='';}
function mostrarVacio(t,d){document.getElementById('main-content').innerHTML=`<div class="estado"><div class="ico">🎁</div><h3>${t}</h3><p>${d}</p></div>`;}
document.getElementById('fecha-inicio').value=hoy();
document.getElementById('fecha-fin').value=hoy();
</script>
</body>
</html>
