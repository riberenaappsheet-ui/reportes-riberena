<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte de Inventario por Ruta</title>
<style>
  :root {
    --verde: #1D9E75;
    --verde-bg: #E1F5EE;
    --verde-text: #085041;
    --rojo: #E24B4A;
    --rojo-bg: #FCEBEB;
    --rojo-text: #501313;
    --gris: #5F5E5A;
    --gris-claro: #F1EFE8;
    --borde: #D3D1C7;
    --texto: #2C2C2A;
    --texto-sec: #888780;
    --blanco: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F8F7F4; color: var(--texto); font-size: 14px; min-height: 100vh; }

  .header { background: var(--blanco); border-bottom: 1px solid var(--borde); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; position: sticky; top: 0; z-index: 100; }
  .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--verde); display: inline-block; }
  .h-title { font-size: 16px; font-weight: 600; }
  .h-sub { font-size: 12px; color: var(--texto-sec); margin-top: 2px; }

  .filtros { background: var(--blanco); border-bottom: 1px solid var(--borde); padding: 12px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .filtros label { font-size: 12px; color: var(--texto-sec); font-weight: 500; }
  .filtros input[type="date"] { border: 1px solid var(--borde); border-radius: 6px; padding: 6px 10px; font-size: 13px; color: var(--texto); background: var(--blanco); outline: none; }
  .filtros input[type="date"]:focus { border-color: var(--verde); }
  .btn { background: var(--verde); color: white; border: none; border-radius: 6px; padding: 7px 16px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.15s; }
  .btn:hover { background: #0F6E56; }
  .btn:disabled { background: var(--borde); cursor: not-allowed; }
  .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; padding: 20px 24px 0; }
  .card-stat { background: var(--blanco); border: 1px solid var(--borde); border-radius: 10px; padding: 14px 16px; text-align: center; }
  .card-stat .num { font-size: 26px; font-weight: 700; margin-bottom: 3px; }
  .card-stat .lbl { font-size: 11px; color: var(--texto-sec); text-transform: uppercase; letter-spacing: 0.5px; }
  .card-stat.verde .num { color: var(--verde); }
  .card-stat.rojo .num { color: var(--rojo); }
  .card-stat.gris .num { color: var(--gris); }

  .main { padding: 20px 24px; }
  .rutas-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }

  .ruta-card { background: var(--blanco); border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; }
  .ruta-card.ok { border-left: 4px solid var(--verde); }
  .ruta-card.falta { border-left: 4px solid var(--rojo); }

  .ruta-header { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; gap: 12px; flex-wrap: wrap; }
  .ruta-header:hover { background: var(--gris-claro); }
  .ruta-nombre { font-weight: 600; font-size: 14px; }
  .ruta-responsable { font-size: 12px; color: var(--texto-sec); margin-top: 2px; }

  .ruta-nums { display: flex; gap: 16px; align-items: center; }
  .num-item { text-align: center; }
  .num-item .n { font-size: 15px; font-weight: 600; }
  .num-item .l { font-size: 10px; color: var(--texto-sec); text-transform: uppercase; }

  .ruta-badges { display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .badge.ok { background: var(--verde-bg); color: var(--verde-text); }
  .badge.falta { background: var(--rojo-bg); color: var(--rojo-text); }
  .chevron { font-size: 14px; color: var(--texto-sec); transition: transform 0.2s; }
  .ruta-card.open .chevron { transform: rotate(180deg); }

  .ruta-detalle { display: none; border-top: 1px solid var(--borde); }
  .ruta-card.open .ruta-detalle { display: block; }

  .detalle-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .detalle-table th { background: var(--gris-claro); padding: 8px 12px; text-align: left; font-size: 11px; font-weight: 600; color: var(--texto-sec); text-transform: uppercase; letter-spacing: 0.4px; }
  .detalle-table th.r, .detalle-table td.r { text-align: right; }
  .detalle-table td { padding: 8px 12px; border-top: 1px solid var(--gris-claro); }
  .detalle-table tr:hover td { background: #fafaf8; }
  .dif-falta { color: var(--rojo); font-weight: 600; }
  .dif-ok { color: var(--verde); font-weight: 600; }
  .dif-cero { color: var(--texto-sec); }

  .estado { text-align: center; padding: 60px 24px; color: var(--texto-sec); }
  .estado .ico { font-size: 40px; margin-bottom: 12px; }
  .estado h3 { font-size: 15px; font-weight: 600; color: var(--texto); margin-bottom: 6px; }
  .estado p { font-size: 13px; line-height: 1.6; max-width: 380px; margin: 0 auto; }

  .error-box { background: var(--rojo-bg); border: 1px solid #F7C1C1; border-radius: 8px; padding: 12px 16px; color: var(--rojo-text); font-size: 13px; margin: 16px 24px; line-height: 1.5; }

  .sec-titulo { font-size: 13px; font-weight: 600; color: var(--texto-sec); text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .leyenda { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .ley-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--texto-sec); }
  .ley-dot { width: 10px; height: 10px; border-radius: 2px; }
  .ley-dot.verde { background: var(--verde); }
  .ley-dot.rojo { background: var(--rojo); }

  @media (max-width: 600px) {
    .header, .filtros, .main, .resumen { padding-left: 14px; padding-right: 14px; }
    .resumen { grid-template-columns: repeat(2, 1fr); }
    .ruta-nums { gap: 10px; }
    .detalle-table { font-size: 12px; }
    .detalle-table th, .detalle-table td { padding: 7px 8px; }
  }
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:12px;">
    <span class="logo-dot"></span>
    <div>
      <div class="h-title">Reporte de Inventario por Ruta</div>
      <div class="h-sub">Auditoría: Despachado − Vendido − No Vendido</div>
    </div>
  </div>
  <div id="ultima-act" style="font-size:11px;color:var(--texto-sec);"></div>
</div>

<div class="filtros">
  <label>Desde</label>
  <input type="date" id="fecha-inicio">
  <span style="color:var(--borde);">—</span>
  <label>Hasta</label>
  <input type="date" id="fecha-fin">
  <button class="btn" id="btn-cargar" onclick="cargarDatos()">
    <div class="spinner" id="spinner"></div>
    <span id="btn-texto">Cargar datos</span>
  </button>
</div>

<div id="error-container"></div>

<div class="resumen" id="resumen" style="display:none;">
  <div class="card-stat gris"><div class="num" id="s-rutas">—</div><div class="lbl">Rutas</div></div>
  <div class="card-stat gris"><div class="num" id="s-desp">—</div><div class="lbl">Despachado</div></div>
  <div class="card-stat gris"><div class="num" id="s-vend">—</div><div class="lbl">Vendido</div></div>
  <div class="card-stat gris"><div class="num" id="s-nv">—</div><div class="lbl">No vendido</div></div>
  <div class="card-stat verde"><div class="num" id="s-ok">—</div><div class="lbl">Sin diferencia</div></div>
  <div class="card-stat rojo"><div class="num" id="s-falta">—</div><div class="lbl">Con diferencia</div></div>
</div>

<div class="main" id="main-content">
  <div class="estado" id="estado-inicial">
    <div class="ico">📦</div>
    <h3>Selecciona un rango de fechas</h3>
    <p>Elige las fechas y presiona <strong>Cargar datos</strong> para ver la auditoría de inventario por ruta.</p>
  </div>
</div>

<script>
const SHEETS = {
  despachoDetalle: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRWTHaP6fZIDbxalv-CZvOUZvDtuxm70JFhpvXbei3fd3C0cjJn3tNLNt5kIrEJP8oO8lt_WXo2G61S/pub?gid=1458495664&single=true&output=csv',
  noVendido:       'https://docs.google.com/spreadsheets/d/e/2PACX-1vRWTHaP6fZIDbxalv-CZvOUZvDtuxm70JFhpvXbei3fd3C0cjJn3tNLNt5kIrEJP8oO8lt_WXo2G61S/pub?gid=1322407571&single=true&output=csv',
  otProducto:      'https://docs.google.com/spreadsheets/d/e/2PACX-1vRWQe1MHjBbSlsFf7UDg7eCmXV0Mq7dfYY1s_bJAqqAlLCh2LqTFVQZHfX_mYpbQ1084e-KnZJwlXuL/pub?gid=392195505&single=true&output=csv',
  merRuta:         'https://docs.google.com/spreadsheets/d/e/2PACX-1vRWQe1MHjBbSlsFf7UDg7eCmXV0Mq7dfYY1s_bJAqqAlLCh2LqTFVQZHfX_mYpbQ1084e-KnZJwlXuL/pub?gid=0&single=true&output=csv'
};

function parseCSVLine(line) {
  const r=[]; let c='', inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){inQ=!inQ;}
    else if(ch===','&&!inQ){r.push(c);c='';}
    else{c+=ch;}
  }
  r.push(c); return r;
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if(lines.length<2) return [];
  const headers = parseCSVLine(lines[0]).map(h=>h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line=>{
    const vals=parseCSVLine(line);
    const obj={};
    headers.forEach((h,i)=>{ obj[h]=(vals[i]||'').trim().replace(/^"|"$/g,''); });
    return obj;
  }).filter(r=>Object.values(r).some(v=>v!==''));
}

async function fetchCSV(url) {
  const resp = await fetch(url);
  if(!resp.ok) throw new Error(`HTTP ${resp.status} al cargar datos`);
  return parseCSV(await resp.text());
}

function normFecha(f) {
  if(!f) return '';
  f=f.trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(f)) return f.substring(0,10);
  const p=f.split(/[\/\-]/);
  if(p.length===3){
    if(p[0].length===4) return `${p[0]}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}`;
    if(parseInt(p[0])>12) return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
    return `${p[2]}-${p[0].padStart(2,'0')}-${p[1].padStart(2,'0')}`;
  }
  return f;
}

function enRango(fecha,desde,hasta){ const f=normFecha(fecha); return f>=desde&&f<=hasta; }
function hoy(){ return new Date().toISOString().split('T')[0]; }
function fmt(n){ return Math.round(n).toLocaleString('es'); }
function fmtF(f){ if(!f)return''; const[y,m,d]=f.split('-'); return`${d}/${m}/${y}`; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function cargarDatos() {
  const desde=document.getElementById('fecha-inicio').value;
  const hasta=document.getElementById('fecha-fin').value;
  if(!desde||!hasta){mostrarError('Selecciona un rango de fechas.');return;}
  if(desde>hasta){mostrarError('La fecha de inicio debe ser anterior a la fecha final.');return;}
  setLoading(true); limpiarError();

  try {
    const [detalleRows,nvRows,otRows,rutaRows] = await Promise.all([
      fetchCSV(SHEETS.despachoDetalle),
      fetchCSV(SHEETS.noVendido),
      fetchCSV(SHEETS.otProducto),
      fetchCSV(SHEETS.merRuta)
    ]);

    const rutasFiltradas = rutaRows.filter(r=>
      enRango(r['Fecha'],desde,hasta) &&
      r['ELIMINADO']!=='Y' &&
      r['RUTA']&&r['RUTA']!==''
    );

    if(rutasFiltradas.length===0){
      mostrarVacio('Sin rutas en el período','No se encontraron rutas entre las fechas seleccionadas.');
      setLoading(false); return;
    }

    // Mapa ID_OP -> {ruta, responsable}
    const idOpARuta={};
    rutasFiltradas.forEach(r=>{
      (r['Despacho']||'').split(',').forEach(idOp=>{
        const k=idOp.trim();
        if(k) idOpARuta[k]={ruta:r['RUTA'],responsable:r['Responsable']||''};
      });
    });

    // Acumular por ruta||producto
    const despMap={}, nvMap={}, vendMap={};

    detalleRows.forEach(r=>{
      if(r['ELIMINADO']==='Y') return;
      const info=idOpARuta[r['ID_OP']]; if(!info) return;
      const k=`${info.ruta}||${r['Producto']}`;
      despMap[k]=(despMap[k]||0)+(parseFloat(r['Cantidad'])||0);
    });

    nvRows.forEach(r=>{
      if(r['ELIMINADO']==='Y') return;
      const info=idOpARuta[r['ID_OP']]; if(!info) return;
      const k=`${info.ruta}||${r['Producto']}`;
      nvMap[k]=(nvMap[k]||0)+(parseFloat(r['Cantidad'])||0);
    });

    const rutasSet=new Set(rutasFiltradas.map(r=>r['RUTA']));
    otRows.forEach(r=>{
      if(r['ELIMINADO']==='Y') return;
      if(!rutasSet.has(r['Ruta'])) return;
      if(!enRango(r['Fecha'],desde,hasta)) return;
      const k=`${r['Ruta']}||${r['Producto']}`;
      vendMap[k]=(vendMap[k]||0)+(parseFloat(r['Cantidad'])||0);
    });

    // Construir estructura por ruta
    const todasKeys=new Set([...Object.keys(despMap),...Object.keys(nvMap),...Object.keys(vendMap)]);
    const porRuta={};
    todasKeys.forEach(key=>{
      const [ruta,producto]=key.split('||');
      if(!porRuta[ruta]){
        const ri=rutasFiltradas.find(r=>r['RUTA']===ruta);
        porRuta[ruta]={ruta,responsable:ri?(ri['Responsable']||')':'',productos:[]};
      }
      const desp=despMap[key]||0, vend=vendMap[key]||0, nv=nvMap[key]||0;
      porRuta[ruta].productos.push({producto,desp,vend,nv,dif:desp-vend-nv});
    });

    const rutas=Object.values(porRuta).map(r=>{
      r.totalDesp=r.productos.reduce((s,p)=>s+p.desp,0);
      r.totalVend=r.productos.reduce((s,p)=>s+p.vend,0);
      r.totalNV=r.productos.reduce((s,p)=>s+p.nv,0);
      r.totalDif=r.productos.reduce((s,p)=>s+p.dif,0);
      r.tieneFalta=r.totalDif!==0;
      r.productos.sort((a,b)=>Math.abs(b.dif)-Math.abs(a.dif));
      return r;
    });

    rutas.sort((a,b)=>{
      if(a.tieneFalta&&!b.tieneFalta) return -1;
      if(!a.tieneFalta&&b.tieneFalta) return 1;
      return a.ruta.localeCompare(b.ruta);
    });

    renderReporte(rutas,desde,hasta);

  } catch(e) {
    mostrarError('No se pudieron cargar los datos. Verifica que las hojas estén publicadas como CSV público.<br><small style="opacity:0.7">'+e.message+'</small>');
  }
  setLoading(false);
}

function renderReporte(rutas,desde,hasta) {
  document.getElementById('s-rutas').textContent=rutas.length;
  document.getElementById('s-desp').textContent=fmt(rutas.reduce((s,r)=>s+r.totalDesp,0));
  document.getElementById('s-vend').textContent=fmt(rutas.reduce((s,r)=>s+r.totalVend,0));
  document.getElementById('s-nv').textContent=fmt(rutas.reduce((s,r)=>s+r.totalNV,0));
  document.getElementById('s-ok').textContent=rutas.filter(r=>!r.tieneFalta).length;
  document.getElementById('s-falta').textContent=rutas.filter(r=>r.tieneFalta).length;
  document.getElementById('resumen').style.display='';
  document.getElementById('ultima-act').textContent='Actualizado '+new Date().toLocaleTimeString('es');

  const fechaStr=desde===hasta?fmtF(desde):`${fmtF(desde)} – ${fmtF(hasta)}`;

  let html=`
    <div class="sec-titulo" style="margin-bottom:12px;">
      <span>${rutas.length} rutas &middot; ${fechaStr}</span>
      <div class="leyenda">
        <div class="ley-item"><div class="ley-dot verde"></div> Sin diferencia</div>
        <div class="ley-item"><div class="ley-dot rojo"></div> Con diferencia</div>
      </div>
    </div>
    <div class="rutas-grid">`;

  rutas.forEach((r,i)=>{
    const cls=r.tieneFalta?'falta':'ok';
    const badgeTxt=r.tieneFalta?`⚠ ${fmt(Math.abs(r.totalDif))} unid. sin rendir`:'✓ Cuadra';
    html+=`
      <div class="ruta-card ${cls}" id="rc-${i}">
        <div class="ruta-header" onclick="tog(${i})">
          <div>
            <div class="ruta-nombre">Ruta ${esc(r.ruta)}</div>
            <div class="ruta-responsable">${esc(r.responsable)}</div>
          </div>
          <div class="ruta-nums">
            <div class="num-item"><div class="n">${fmt(r.totalDesp)}</div><div class="l">Desp.</div></div>
            <div class="num-item"><div class="n">${fmt(r.totalVend)}</div><div class="l">Vend.</div></div>
            <div class="num-item"><div class="n">${fmt(r.totalNV)}</div><div class="l">No vend.</div></div>
          </div>
          <div class="ruta-badges">
            <span class="badge ${cls}">${badgeTxt}</span>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="ruta-detalle">
          <table class="detalle-table">
            <thead><tr>
              <th>Producto</th>
              <th class="r">Despachado</th>
              <th class="r">Vendido</th>
              <th class="r">No vendido</th>
              <th class="r">Diferencia</th>
            </tr></thead>
            <tbody>
              ${r.productos.map(p=>{
                let dc='dif-cero', dt='—';
                if(p.dif>0){dc='dif-falta';dt=`−${fmt(p.dif)}`;}
                else if(p.dif<0){dc='dif-ok';dt=`+${fmt(Math.abs(p.dif))}`;}
                return`<tr><td>${esc(p.producto)}</td><td class="r">${fmt(p.desp)}</td><td class="r">${fmt(p.vend)}</td><td class="r">${fmt(p.nv)}</td><td class="r ${dc}">${dt}</td></tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  });
  html+='</div>';
  document.getElementById('main-content').innerHTML=html;
}

function tog(i){ document.getElementById('rc-'+i).classList.toggle('open'); }

function setLoading(v){
  document.getElementById('spinner').style.display=v?'block':'none';
  document.getElementById('btn-texto').textContent=v?'Cargando...':'Cargar datos';
  document.getElementById('btn-cargar').disabled=v;
}
function mostrarError(msg){
  document.getElementById('error-container').innerHTML=`<div class="error-box">⚠ ${msg}</div>`;
  document.getElementById('main-content').innerHTML='';
  document.getElementById('resumen').style.display='none';
}
function limpiarError(){ document.getElementById('error-container').innerHTML=''; }
function mostrarVacio(t,d){
  document.getElementById('main-content').innerHTML=`<div class="estado"><div class="ico">🔍</div><h3>${t}</h3><p>${d}</p></div>`;
  document.getElementById('resumen').style.display='none';
}

document.getElementById('fecha-inicio').value=hoy();
document.getElementById('fecha-fin').value=hoy();
</script>
</body>
</html>
